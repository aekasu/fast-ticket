ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Serve the bridge auth endpoint (api/auth/integration.php) at the
    # extensionless URL FastAPI calls. osTicket's api/.htaccess rewrites every
    # non-file /api/* URL to api/http.php ("URL not supported"). A vhost-level
    # rewrite runs before that per-directory rule, and once the URI points at
    # an existing file the .htaccess rule (RewriteCond !-f) no longer matches.
    # The bridge validates X-Integration-Key itself.
    RewriteEngine On
    RewriteRule ^/api/auth/integration$ /api/auth/integration.php [L]

    PassEnv FASTAPI_INTEGRATION_KEY

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
