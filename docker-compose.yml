services:
  # ── MySQL/MariaDB ────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MARIADB_USER: osticket
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MARIADB_DATABASE: osticket
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── osTicket (HTTP + PHP) ────────────────────────────────────────────────────
  osticket:
    build:
      context: .
      dockerfile: docker/osticket/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./docker/osticket/ost-config.php:/var/www/html/include/ost-config.php
    environment:
      MYSQL_HOST: db
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: osticket
      FASTAPI_INTEGRATION_KEY: ${FASTAPI_INTEGRATION_KEY:?Set FASTAPI_INTEGRATION_KEY in .env}
      OSTICKET_ADMIN_EMAIL: ${OSTICKET_ADMIN_EMAIL:-admin@example.local}
      OSTICKET_ADMIN_FIRSTNAME: ${OSTICKET_ADMIN_FIRSTNAME:-Admin}
      OSTICKET_ADMIN_LASTNAME: ${OSTICKET_ADMIN_LASTNAME:-User}
      OSTICKET_ADMIN_PASSWORD: ${OSTICKET_ADMIN_PASSWORD:-changeme-admin}
      OSTICKET_SITE_NAME: ${OSTICKET_SITE_NAME:-fast-ticket Dev}
      OSTICKET_AUTO_SETUP: ${OSTICKET_AUTO_SETUP:-true}
      # Must NOT be 'admin', 'admins', 'username', or 'osticket' (installer blocks them)
      OSTICKET_ADMIN_USERNAME: ${OSTICKET_ADMIN_USERNAME:-helpdesk}
      # Must differ from OSTICKET_ADMIN_EMAIL
      OSTICKET_SYSTEM_EMAIL: ${OSTICKET_SYSTEM_EMAIL:-support@example.local}
      START_CRON: "0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The bridge auth endpoint answers 403 to a keyless POST, but only once osTicket is
      # fully installed (main.inc.php bootstraps first), the plugin installer has copied
      # integration.php, and the Apache rewrite routes the extensionless URL to it.
      # (index.php would 302 to the setup wizard even on a broken install.)
      test: ["CMD-SHELL", "[ \"$$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/auth/integration)\" = 403 ]"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  # ── osTicket cron worker (bridge command processor) ───────────────────────────
  osticket-cron:
    build:
      context: .
      dockerfile: docker/osticket/Dockerfile
    volumes:
      - ./docker/osticket/ost-config.php:/var/www/html/include/ost-config.php
    environment:
      MYSQL_HOST: db
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: osticket
      FASTAPI_INTEGRATION_KEY: ${FASTAPI_INTEGRATION_KEY}
      START_CRON: "1"
    depends_on:
      osticket:
        condition: service_healthy
    restart: unless-stopped

  # ── FastAPI application ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro       # hot-reload in dev; remove :ro for write access
    environment:
      DATABASE_URL: mysql+aiomysql://osticket:${MYSQL_PASSWORD}@db:3306/osticket
      FASTAPI_INTEGRATION_KEY: ${FASTAPI_INTEGRATION_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      OSTICKET_AUTH_URL: http://osticket/api/auth/integration
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTO_CREATE_SCHEMA: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
