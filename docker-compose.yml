services:
  # ── MySQL/MariaDB ────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MARIADB_USER: osticket
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MARIADB_DATABASE: osticket
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── osTicket (HTTP + PHP) ────────────────────────────────────────────────────
  osticket:
    build:
      context: .
      dockerfile: docker/osticket/Dockerfile
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: osticket
      FASTAPI_INTEGRATION_KEY: ${FASTAPI_INTEGRATION_KEY:?Set FASTAPI_INTEGRATION_KEY in .env}
      OSTICKET_ADMIN_EMAIL: ${OSTICKET_ADMIN_EMAIL:-admin@example.local}
      OSTICKET_ADMIN_FIRSTNAME: ${OSTICKET_ADMIN_FIRSTNAME:-Admin}
      OSTICKET_ADMIN_LASTNAME: ${OSTICKET_ADMIN_LASTNAME:-User}
      OSTICKET_ADMIN_PASSWORD: ${OSTICKET_ADMIN_PASSWORD:-changeme-admin}
      OSTICKET_SITE_NAME: ${OSTICKET_SITE_NAME:-fast-ticket Dev}
      START_CRON: "0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ── osTicket cron worker (bridge command processor) ───────────────────────────
  osticket-cron:
    build:
      context: .
      dockerfile: docker/osticket/Dockerfile
    environment:
      MYSQL_HOST: db
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: osticket
      FASTAPI_INTEGRATION_KEY: ${FASTAPI_INTEGRATION_KEY}
      START_CRON: "1"
    depends_on:
      osticket:
        condition: service_healthy
    restart: unless-stopped

  # ── FastAPI application ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro       # hot-reload in dev; remove :ro for write access
    environment:
      DATABASE_URL: mysql+aiomysql://osticket:${MYSQL_PASSWORD}@db:3306/osticket
      FASTAPI_INTEGRATION_KEY: ${FASTAPI_INTEGRATION_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      OSTICKET_AUTH_URL: http://osticket/api/auth/integration
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTO_CREATE_SCHEMA: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
