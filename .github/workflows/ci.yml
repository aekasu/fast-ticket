name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"      # weekly: the audit job catches advisories published since the last push

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"
      - name: Install the locked dependencies
        run: uv sync --frozen --extra dev
      - name: Unit and integration tests
        run: uv run pytest tests/ -q
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          FASTAPI_INTEGRATION_KEY: "test-integration-key-32-chars-long!!"
          JWT_SECRET_KEY: "test-jwt-secret-key-48-chars-long-for-testing!!"
          OSTICKET_AUTH_URL: http://localhost/not-used-in-tests
          AUTO_CREATE_SCHEMA: "false"
          REQUIRE_JWT_SECRET: "false"
      - name: The bridge plugin lints (PHP syntax)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          find bridge -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  audit:
    # Known vulnerabilities in the locked runtime dependencies. Also runs weekly: a new advisory
    # lands without any change to this repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  image:
    # The production image builds, runs as a non-root user and answers /health.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f docker/fastapi/Dockerfile --target runtime -t fast-ticket-api .
      - name: Runs unprivileged
        run: test "$(docker run --rm --entrypoint id fast-ticket-api -u)" = "10001"
